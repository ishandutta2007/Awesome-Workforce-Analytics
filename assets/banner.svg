<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Filters for dynamic glow and shadow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .pulse-node {
      animation: pulse 3s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
  </style>

  <!-- Main Dark Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />

  <!-- Geometric Decorative Grid -->
  <g opacity="0.15">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8"/>
    <path d="M 200,0 L 200,340 M 400,0 L 400,340 M 600,0 L 600,340 M 800,0 L 800,340 M 1000,0 L 1000,340" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8"/>
  </g>

  <!-- Abstract Dynamic Data Wave Graph on Right -->
  <g opacity="0.4" filter="url(#glow)">
    <path d="M 750,260 Q 850,140 950,210 T 1150,110" fill="none" stroke="#38bdf8" stroke-width="4" />
    <path d="M 750,280 Q 860,180 970,240 T 1150,150" fill="none" stroke="#818cf8" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M 750,230 Q 840,260 930,170 T 1150,90" fill="none" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Analytics Bar Nodes -->
  <g transform="translate(820, 110)" filter="url(#subtle-shadow)">
    <rect x="0" y="80" width="22" height="90" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="35" y="40" width="22" height="130" rx="4" fill="#818cf8" opacity="0.9"/>
    <rect x="70" y="100" width="22" height="70" rx="4" fill="#6366f1" opacity="0.7"/>
    <rect x="105" y="20" width="22" height="150" rx="4" fill="#c084fc" opacity="0.95"/>
    <rect x="140" y="60" width="22" height="110" rx="4" fill="#e879f9" opacity="0.85"/>
  </g>

  <!-- Dynamic Animated Nodes -->
  <g filter="url(#glow)">
    <circle cx="1020" cy="90" r="8" fill="#38bdf8" class="pulse-node" />
    <circle cx="1110" cy="140" r="6" fill="#818cf8" />
    <circle cx="950" cy="180" r="7" fill="#c084fc" class="pulse-node" />
    <line x1="1020" y1="90" x2="1110" y2="140" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <line x1="1020" y1="90" x2="950" y2="180" stroke="#c084fc" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Hero Content Left Side -->
  <g transform="translate(70, 75)" filter="url(#subtle-shadow)">
    <g transform="translate(0, 0)">
      <rect width="270" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="16" cy="15" r="5" fill="#38bdf8" />
      <text x="30" y="20" class="badge">PEOPLE &amp; WORKFORCE ANALYTICS</text>
    </g>

    <text x="0" y="82" class="title">Awesome Workforce Analytics</text>
    <text x="0" y="122" class="subtitle">Curated SaaS Platforms, People Analytics, Attrition Models &amp; Open-Source HR Tools</text>

    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="165" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="21" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">📊 10+ Enterprise SaaS</text>

      <rect x="180" y="0" width="185" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="194" y="21" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">🚀 15+ Open-Source Repos</text>

      <rect x="380" y="0" width="175" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="394" y="21" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">💡 Attrition &amp; Org Design</text>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="url(#text-grad)" stroke-width="1.5" opacity="0.4"/>
</svg>
